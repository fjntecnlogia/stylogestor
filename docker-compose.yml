version: '3.9'

# ============================================================
# STYLOGESTOR — Docker Compose (Desenvolvimento Local)
# ============================================================
# Uso: docker-compose up -d
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: stylogestor_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: stylogestor
      POSTGRES_USER: stylo
      POSTGRES_PASSWORD: stylo@2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stylo -d stylogestor"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stylogestor_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  evolution:
    image: atendai/evolution-api:v2.1.1
    container_name: stylogestor_whatsapp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: stylo_evolution_key_2026
      DATABASE_ENABLED: "false"
      REDIS_ENABLED: "true"
      REDIS_URI: redis://redis:6379/1
      INSTANCE_NAME: stylogestor
    depends_on:
      - redis
    volumes:
      - evolution_data:/evolution/instances

volumes:
  postgres_data:
  redis_data:
  evolution_data:
