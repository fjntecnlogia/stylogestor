name: 🚀 Deploy STYLOGESTOR

# A VPS de produção (Hostinger) usa PM2 direto (não Docker) pros 5 apps.
# Esse workflow faz quality check no CI e depois SSH na VPS pra rodar
# deploy-pm2.sh — que faz git pull, build dos 5 apps e pm2 reload.
#
# Secrets necessários (ver .github/SECRETS_DEPLOY.md):
#   - VPS_HOST, VPS_USER, VPS_SSH_KEY (obrigatórios)
#   - VPS_PORT (opcional, default 22)

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── 1. Quality check (typecheck + build local pra detectar erro ANTES de SSH) ───
  quality:
    name: ✅ Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup lê a versão automaticamente do packageManager
      # declarado em package.json (atualmente pnpm@11.0.9).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # pnpm 11 requer Node >= 22.13
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar Prisma Client (necessário pro typecheck)
        run: pnpm --filter @stylogestor/database run generate

      - name: Typecheck API (NestJS)
        run: pnpm --filter @stylogestor/api exec tsc --noEmit
        continue-on-error: true # API ainda em estabilização

      - name: Typecheck Web (Next.js)
        run: pnpm --filter web exec tsc --noEmit

      - name: Build Web (smoke)
        run: pnpm --filter web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # ─── 2. Deploy via SSH+PM2 na VPS Hostinger ──────────────────────
  deploy:
    name: 🚀 Deploy PM2 na VPS
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/stylogestor
            bash infra/vps/deploy-pm2.sh

      - name: Sucesso
        if: success()
        run: echo "✅ Deploy realizado com sucesso em $(date)"

      - name: Falha
        if: failure()
        run: |
          echo "❌ Deploy falhou. Veja os logs acima."
          echo "Pra debugar, SSH na VPS e rode manualmente:"
          echo "   cd /opt/stylogestor && bash infra/vps/deploy-pm2.sh"
          exit 1
