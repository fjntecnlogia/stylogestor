name: 🚀 Deploy STYLOGESTOR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── 1. Lint e Typecheck ─────────────────────────────────
  quality:
    name: ✅ Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @stylogestor/api exec tsc --noEmit || true

  # ─── 2. Build das imagens Docker ─────────────────────────
  build:
    name: 🔨 Build Docker Images
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/stylogestor-api:latest,${{ secrets.DOCKER_USERNAME }}/stylogestor-api:${{ github.sha }}

      - name: Build & Push Web (Dashboard)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/stylogestor-web:latest

      - name: Build & Push Site (Vendas)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/site/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/stylogestor-site:latest

      - name: Build & Push Booking
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/booking/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/stylogestor-booking:latest

  # ─── 3. Deploy no VPS Hostinger ──────────────────────────
  deploy:
    name: 🚀 Deploy VPS Hostinger
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/stylogestor
            git pull origin main
            bash infra/vps/deploy.sh
            echo "✅ Deploy concluído: $(date)"

      - name: Notificar sucesso
        if: success()
        run: echo "🎉 Deploy realizado com sucesso!"

      - name: Notificar falha
        if: failure()
        run: echo "❌ Deploy falhou! Verifique os logs."
