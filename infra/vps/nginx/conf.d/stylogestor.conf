# ============================================================
# STYLOGESTOR — Nginx Virtual Hosts
# Substitua DOMINIO pelo seu domínio real (ex: stylogestor.com.br)
# ============================================================

# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name stylogestor.com.br www.stylogestor.com.br app.stylogestor.com.br api.stylogestor.com.br *.stylogestor.com.br;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ─── Site de Vendas (stylogestor.com.br / www.) ─────────────
server {
    listen 443 ssl http2;
    server_name stylogestor.com.br www.stylogestor.com.br;

    ssl_certificate /etc/letsencrypt/live/stylogestor.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stylogestor.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    limit_req zone=general burst=20 nodelay;

    location / {
        proxy_pass http://site:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}

# ─── Dashboard (app.stylogestor.com.br) ─────────────────────
server {
    listen 443 ssl http2;
    server_name app.stylogestor.com.br;

    ssl_certificate /etc/letsencrypt/live/stylogestor.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stylogestor.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}

# ─── API Backend (api.stylogestor.com.br) ───────────────────
server {
    listen 443 ssl http2;
    server_name api.stylogestor.com.br;

    ssl_certificate /etc/letsencrypt/live/stylogestor.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stylogestor.com.br/privkey.pem;

    limit_req zone=api burst=50 nodelay;

    location / {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ─── Booking / Subdomínios de Tenant (*.stylogestor.com.br) ─
server {
    listen 443 ssl http2;
    server_name *.stylogestor.com.br;

    ssl_certificate /etc/letsencrypt/live/stylogestor.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stylogestor.com.br/privkey.pem;

    location / {
        proxy_pass http://booking:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}
