# ============================================================
# STYLOGESTOR — Nginx para Cloudflare Proxy
# SSL termina no Cloudflare. Nginx recebe HTTP na porta 80.
# ============================================================

# ─── Site de Vendas (stylogestor.com.br) ────────────────────
server {
    listen 80;
    server_name stylogestor.com.br www.stylogestor.com.br;

    location / {
        proxy_pass http://site:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}

# ─── Dashboard (app.stylogestor.com.br) ─────────────────────
server {
    listen 80;
    server_name app.stylogestor.com.br;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}

# ─── Admin SaaS (admin.stylogestor.com.br) ──────────────────
# ACESSO RESTRITO — apenas IPs autorizados
server {
    listen 80;
    server_name admin.stylogestor.com.br;

    # Restrição de IP — só você acessa
    # Adicione seu IP fixo ou range abaixo
    # allow 200.x.x.x;   # seu IP (veja em meuip.com.br)
    # deny all;

    location / {
        # Admin roda via PM2 no host (não em container Docker).
        # `host.docker.internal` aponta para o host a partir do container nginx.
        # Requer extra_hosts no serviço nginx do docker-compose.prod.yml.
        proxy_pass http://host.docker.internal:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}

# ─── API Backend (api.stylogestor.com.br) ───────────────────
server {
    listen 80;
    server_name api.stylogestor.com.br;

    limit_req zone=api burst=50 nodelay;

    location / {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

# ─── Booking Público (*.stylogestor.com.br) ─────────────────
server {
    listen 80;
    server_name *.stylogestor.com.br;

    location / {
        proxy_pass http://booking:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}
