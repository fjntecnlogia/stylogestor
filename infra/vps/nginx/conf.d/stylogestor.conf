# ============================================================
# STYLOGESTOR — Nginx para Cloudflare Proxy
# O SSL termina no Cloudflare. Nginx recebe HTTP na porta 80.
# Cloudflare → (HTTPS) → Nginx (HTTP interno)
# ============================================================

# ─── Site de Vendas ──────────────────────────────────────────
server {
    listen 80;
    server_name stylogestor.com.br www.stylogestor.com.br;

    location / {
        proxy_pass http://site:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# ─── Dashboard (app.) ────────────────────────────────────────
server {
    listen 80;
    server_name app.stylogestor.com.br;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }
}

# ─── API Backend (api.) ──────────────────────────────────────
server {
    listen 80;
    server_name api.stylogestor.com.br;

    # Rate limiting na API
    limit_req zone=api burst=50 nodelay;

    location / {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

# ─── Booking Público (*.stylogestor.com.br) ──────────────────
server {
    listen 80;
    server_name *.stylogestor.com.br;

    location / {
        proxy_pass http://booking:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}
