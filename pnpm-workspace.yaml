packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@clerk/shared': true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  browser-tabs-lock: set this to true or false
  bufferutil: set this to true or false
  core-js: set this to true or false
  prisma: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: set this to true or false
