packages:
  - "apps/*"
  - "packages/*"

# Builds nativos aprovados (pnpm 11 exige whitelist explícita).
# Adicionar deps que tenham postinstall/install scripts legítimos.
allowBuilds:
  '@clerk/shared': true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@sentry/cli': true
  '@sentry-internal/node-cpu-profiler': true
  '@swc/core': true
  browser-tabs-lock: true
  bufferutil: true
  core-js: true
  prisma: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
